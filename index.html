<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的学习助手</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; }
        #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .user { color: blue; margin-bottom: 5px; }
        .bot { color: green; margin-bottom: 15px; }
        #input-box { width: 80%; padding: 8px; }
        #send-btn { padding: 8px 15px; }
    </style>
</head>
<body>
    <h2>📚 我的私人学习助手</h2>
    <div id="chat-box"></div>
    <input type="text" id="input-box" placeholder="输入你的问题，例如：帮我读一下 text.md..." />
    <button id="send-btn">发送</button>

    <script>
        const chatBox = document.getElementById('chat-box');
        const inputBox = document.getElementById('input-box');
        const sendBtn = document.getElementById('send-btn');

        async function sendMessage() {
            const message = inputBox.value;
            if (!message) return;

            // 1. 把用户的话显示在网页上
            chatBox.innerHTML += `<div class="user">👤 你: ${message}</div>`;
            inputBox.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. 发送网络请求给后厨（和你 client.py 做的事情一模一样！）
            const response = await fetch('http://localhost:8000/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message }) // 👈 这就是点菜单！
            });

            const data = await response.json();
            
            // 3. 把后厨的回答显示在网页上
            chatBox.innerHTML += `<div class="bot">🤖 助手: ${data.reply}</div>`; // 👈 从 reply 盘子里端菜
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        inputBox.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
